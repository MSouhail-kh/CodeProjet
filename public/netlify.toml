[build]
  command = "npm run build"
  publish = "build" 
  base = "/"

[[redirects]]
  from = "/public/static/*"
  to = "/public/static/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["axios"]
